plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
}

version = mod_version
group = 'com.projectredserverguifix'
archivesBaseName = 'ProjectRedFixes'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: 'official', version: mc_version

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                projectred_server_gui_fix {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            args '--nogui'

            mods {
                projectred_server_gui_fix {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://proxy-maven.covers1624.net/' }
    maven { url = 'https://nexus.covers1624.net/repository/maven-releases/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    implementation fg.deobf("mrtjp:ProjectRed:${mc_version}-${projectred_version}:core")
    implementation fg.deobf("mrtjp:ProjectRed:${mc_version}-${projectred_version}:integration")
    implementation fg.deobf("mrtjp:ProjectRed:${mc_version}-${projectred_version}:transmission")

    implementation "codechicken:CodeChickenLib:${mc_version}-${ccl_version}:deobf"
    // Compile-time type support required by Project Red classes; Project Red supplies CBMultipart at runtime.
    implementation "codechicken:CBMultipart:${mc_version}-${cbm_version}:deobf"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'      : 'Project Red Fixes',
                'Specification-Vendor'     : 'Zach',
                'Specification-Version'    : project.version,
                'Implementation-Title'     : 'Project Red Fixes',
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : 'Zach',
                'MixinConfigs'             : 'projectred_server_gui_fix.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
