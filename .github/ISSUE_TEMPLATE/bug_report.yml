name: Bug report
description: Report a ProjectRed 1.16.5 fix failure, crash, or compatibility problem
title: "[Bug]: "
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and Forge versions
      placeholder: "Minecraft 1.16.5, Forge 36.2.34"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: ProjectRed and dependency versions
      description: Include ProjectRed Core, Integration, CodeChickenLib, CBMultipart, and ProjectRed Fixes. Include Transmission and CC:Tweaked when installed.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected fix
      options:
        - Dedicated-server gate GUI
        - Bus Converter
        - CC:Tweaked / bundled signals
        - Other / unsure
    validations:
      required: true

  - type: dropdown
    id: gate
    attributes:
      label: Affected gate or device
      options:
        - Timer
        - State Cell
        - Sequencer
        - Counter
        - Bus Converter
        - Bundled Cable
        - CC:Tweaked Computer
        - Other / not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: latest.log or crash report
      description: Drag and drop latest.log or the relevant crash report here.
    validations:
      required: true
