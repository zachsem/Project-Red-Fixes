name: Fix request
description: Suggest a narrowly scoped Project Red compatibility fix
title: "[Request]: "
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like fixed or changed?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What Project Red 1.16.5 problem would this solve?
      description: Link an upstream Project Red issue or later-version fix when possible.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. If you have an implementation idea, describe it here.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request restores or protects intended Project Red 1.16.5 behavior rather than adding unrelated content.
          required: true
        - label: I checked existing issues for the same request.
          required: true
